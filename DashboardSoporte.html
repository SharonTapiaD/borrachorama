<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soporte CRM - Borrachorama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fffcea; font-family: Arial, sans-serif; }
    .header-soporte {background: url('imagenes/fondocerveza.jpg') no-repeat center center;
      background-size: cover;
      padding: 40px 20px;
      text-align: center; }
    .card-reporte { border: 2px solid #ffc107; transition: transform 0.2s; }
    .card-reporte:hover { transform: scale(1.01); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .badge-Pendiente { background-color: #dc3545; }
    .badge-En_proceso { background-color: #fd7e14; }
    .badge-Resuelto { background-color: #198754; }
  </style>
</head>
<body>

<div class="header-soporte">
    <img src="imagenes/Borrachoramalogo.png" alt="Logo" style="max-width: 150px;">
    <h2 class="mt-2 fw-bold" style="color: white;">🛠️ Panel de Soporte</h2>
</div>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold" style="color: #FF6F00;">Reportes de Usuarios</h3>
                <button class="btn btn-warning fw-bold" onclick="cargarReportes()">🔄 Actualizar Lista</button>
            </div>
            
            <div class="table-responsive bg-white p-3 rounded shadow-sm">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Motivo</th>
                            <th>Mensaje</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaReportesAdmin">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", cargarReportes);

    function cargarReportes() {
        fetch('backend/obtener_todos_reportes.php')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('listaReportesAdmin');
            tbody.innerHTML = "";
            
            data.forEach(r => {
                // Ajuste de nombre de estado para el badge de CSS
                const statusClass = r.estado.replace(" ", "_");
                
                tbody.innerHTML += `
                    <tr class="align-middle">
                        <td>#${r.id}</td>
                        <td><strong>${r.usuario}</strong></td>
                        <td><span class="badge bg-secondary">${r.tipo}</span></td>
                        <td><small>${r.mensaje}</small></td>
                        <td>${r.fecha}</td>
                        <td><span class="badge badge-${statusClass}">${r.estado}</span></td>
                        <td>
                            <select class="form-select form-select-sm" onchange="cambiarEstado(${r.id}, this.value)">
                                <option value="Pendiente" ${r.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                                <option value="En proceso" ${r.estado === 'En proceso' ? 'selected' : ''}>En proceso</option>
                                <option value="Resuelto" ${r.estado === 'Resuelto' ? 'selected' : ''}>Resuelto</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        });
    }

    function cambiarEstado(id, nuevoEstado) {
        const fd = new FormData();
        fd.append('id', id);
        fd.append('estado', nuevoEstado);

        fetch('backend/actualizar_estado_reporte.php', {
            method: 'POST',
            body: fd
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                alert("✅ Estado del reporte #" + id + " actualizado a: " + nuevoEstado);
                cargarReportes();
            }
        });
    }
</script>
</body>
</html>
