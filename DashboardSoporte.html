<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soporte CRM - Borrachorama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fffcea; font-family: Arial, sans-serif; }
    .header-soporte {background: url('imagenes/fondocerveza.jpg') no-repeat center center;
      background-size: cover;
      padding: 40px 20px;
      text-align: center; }
    .badge-Pendiente { background-color: #dc3545; }
    .badge-En_proceso { background-color: #fd7e14; }
    .badge-Resuelto { background-color: #198754; }
  </style>
</head>
<body>

<div class="header-soporte">
    <img src="imagenes/Borrachoramalogo.png" alt="Logo" style="max-width: 150px;">
    <h2 class="mt-2 fw-bold" style="color: white;">🛠️ Panel de Soporte</h2>
</div>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold" style="color: #FF6F00;">Reportes y Quejas</h3>
                <button class="btn btn-warning fw-bold" onclick="cargarReportes()">🔄 Actualizar Lista</button>
            </div>
            
            <div class="table-responsive bg-white p-3 rounded shadow-sm">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Motivo</th>
                            <th>Mensaje del Cliente</th>
                            <th>Nuestra Respuesta</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaReportesAdmin">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResponder" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title">Responder Ticket #<span id="ticketIdTxt"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="inputId">
        <div class="mb-3">
            <label><strong>Respuesta al cliente:</strong></label>
            <textarea id="inputRespuesta" class="form-control" rows="4" placeholder="Escribe tu solución..."></textarea>
        </div>
        <div class="mb-3">
            <label><strong>Cambiar estado a:</strong></label>
            <select id="inputEstado" class="form-select">
                <option value="En proceso">En proceso</option>
                <option value="Resuelto">Resuelto</option>
            </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" onclick="enviarRespuesta()">Guardar y Actualizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", cargarReportes);

    function cargarReportes() {
        fetch('backend/obtener_todos_reportes.php')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('listaReportesAdmin');
            tbody.innerHTML = "";
            
            data.forEach(r => {
                const statusClass = r.estado.replace(" ", "_");
                const respuestaUI = r.respuesta ? r.respuesta : '<em class="text-muted">Sin respuesta aún</em>';
                
                // Escapar comillas para evitar errores de JS
                const respuestaLimpia = r.respuesta ? r.respuesta.replace(/"/g, '&quot;') : '';

                tbody.innerHTML += `
                    <tr class="align-middle">
                        <td>#${r.id}</td>
                        <td><strong>${r.usuario}</strong><br><small>${r.fecha}</small></td>
                        <td><span class="badge bg-secondary">${r.tipo}</span></td>
                        <td><small>${r.mensaje}</small></td>
                        <td><small>${respuestaUI}</small></td>
                        <td><span class="badge badge-${statusClass}">${r.estado}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="abrirModal(${r.id}, '${r.estado}', '${respuestaLimpia}')">
                                💬 Responder
                            </button>
                        </td>
                    </tr>
                `;
            });
        });
    }

    let modalInstancia;
    function abrirModal(id, estadoActual, respuestaActual) {
        document.getElementById('ticketIdTxt').innerText = id;
        document.getElementById('inputId').value = id;
        document.getElementById('inputRespuesta').value = respuestaActual;
        document.getElementById('inputEstado').value = estadoActual === 'Pendiente' ? 'En proceso' : estadoActual;
        
        modalInstancia = new bootstrap.Modal(document.getElementById('modalResponder'));
        modalInstancia.show();
    }

    function enviarRespuesta() {
        const id = document.getElementById('inputId').value;
        const respuesta = document.getElementById('inputRespuesta').value;
        const estado = document.getElementById('inputEstado').value;

        if(respuesta.trim() === '') {
            alert("Debes escribir una respuesta.");
            return;
        }

        const fd = new FormData();
        fd.append('id', id);
        fd.append('respuesta', respuesta);
        fd.append('estado', estado);

        fetch('backend/responder_reporte.php', {
            method: 'POST',
            body: fd
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                modalInstancia.hide();
                cargarReportes(); // Recargar tabla
            } else {
                alert("Error: " + data.msg);
            }
        });
    }
</script>
</body>
</html>
