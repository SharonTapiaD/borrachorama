<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - Borrachorama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #fffceb; }
        header { background: url('imagenes/fondocerveza.jpg') no-repeat center center; background-size: cover; padding: 40px 20px; text-align: center; }
        header img { max-width: 200px; }
        .navbar-custom { background-color: #ffc107; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; font-weight: bold; }
        .card-factura { max-width: 700px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #FF6F00; }
        h2 { color: #FF6F00; font-weight: bold; margin-bottom: 25px; }
        
        /* Estilos para las acciones finales */
        .acciones-finales { display: none; text-align: center; animation: fadeIn 0.5s ease; }
        .btn-accion { margin: 10px; padding: 15px 25px; font-weight: bold; border-radius: 10px; width: 100%; max-width: 300px; display: inline-block; text-decoration: none; border: none; transition: 0.3s; }
        .btn-ver { background: #2196F3; color: white; }
        .btn-descargar { background: #607D8B; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-accion:hover { opacity: 0.9; transform: translateY(-3px); color: white; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <img src="imagenes/Borrachoramalogo.png" alt="Logo">
    </header>

    <nav class="navbar-custom">
        📄 Facturación Electrónica 4.0
    </nav>

    <div class="container">
        <div class="card-factura">
            
            <!-- FORMULARIO (Se ocultará al terminar) -->
            <div id="seccion-formulario">
                <h2>Datos Fiscales</h2>
                <div class="alert alert-warning" id="resumen-pedido">Cargando datos del pedido...</div>

                <form id="facturaForm">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">Nombre o Razón Social</label>
                            <input type="text" class="form-control" id="razonSocial" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">RFC</label>
                            <input type="text" class="form-control" id="rfc" maxlength="13" style="text-transform: uppercase;" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Código Postal</label>
                            <input type="text" class="form-control" id="cp" maxlength="5" required>
                        </div>
                        <div class="col-md-12 mb-4">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="emailFactura" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-3" id="btnGenerar">GENERAR FACTURA 🚀</button>
                </form>
            </div>

            <!-- ACCIONES POST-GENERACIÓN (Se mostrarán al terminar) -->
            <div id="seccion-acciones" class="acciones-finales">
                <div class="text-center mb-4">
                    <div style="font-size: 4rem;">✅</div>
                    <h2 style="color: #4CAF50;">¡Factura Generada!</h2>
                    <p class="text-muted">Tu comprobante fiscal ha sido procesado correctamente.</p>
                </div>

                <button class="btn-accion btn-ver" onclick="verFactura()">👁️ Ver Factura</button>
                <button class="btn-accion btn-descargar" onclick="descargarFactura()">📥 Descargar PDF y XML</button>
                <button class="btn-accion btn-correo" onclick="enviarPorCorreo()" style="background: #EA4335; color: white;">📧 Enviar por Correo</button>
                <button class="btn-accion btn-whatsapp" onclick="enviarPorWhatsApp()">💬 Enviar por WhatsApp</button>

                <hr>
                <a href="inicio.html" class="btn btn-outline-secondary mt-3">Finalizar y volver al inicio</a>
            </div>

        </div>
    </div>

    <script>
        // Cargar resumen del pedido
        document.addEventListener('DOMContentLoaded', () => {
            const lastId = localStorage.getItem('lastPedidoId');
            const pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
            const pedido = (lastId && pedidos.find(p => p.id === lastId)) || pedidos[pedidos.length - 1];

            if (pedido) {
                document.getElementById('resumen-pedido').innerHTML = 
                    `<strong>Orden:</strong> ${pedido.id} | <strong>Total:</strong> $${pedido.total.toFixed(2)} MXN`;
            }
        });

        // Simular generación
        document.getElementById('facturaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGenerar');
            btn.disabled = true;
            btn.innerText = "Conectando con el SAT...";

            // Guardar datos del formulario
            const datosFactura = {
                razonSocial: document.getElementById('razonSocial').value,
                rfc: document.getElementById('rfc').value,
                cp: document.getElementById('cp').value,
                email: document.getElementById('emailFactura').value
            };
            localStorage.setItem('datosFactura', JSON.stringify(datosFactura));
            console.log('Datos guardados en localStorage:', datosFactura);

            setTimeout(() => {
                // Ocultar formulario y mostrar acciones
                document.getElementById('seccion-formulario').style.display = 'none';
                document.getElementById('seccion-acciones').style.display = 'block';
            }, 2000);
        });

        // Funciones de los botones
        function verFactura() {
            window.location.href = 'factura.html';
        }

        function descargarFactura() {
            // Redirigir a factura y luego descargar
            window.location.href = 'factura.html?descargar=true';
        }

        function enviarPorCorreo() {
            const datos = JSON.parse(localStorage.getItem('datosFactura') || '{}');
            const pedido = JSON.parse(localStorage.getItem('pedidos') || '[]').find(p => p.id === localStorage.getItem('lastPedidoId'));
            const total = pedido ? pedido.total : 0;
            
            const asunto = encodeURIComponent(`Factura Electrónica - Borrachorama - Folio ${Date.now().toString().slice(-8)}`);
            const cuerpo = encodeURIComponent(`Estimado ${datos.razonSocial},

Adjunto encontrará su factura electrónica correspondiente a su compra en Borrachorama.

Detalles de la factura:
- Folio: FCT-${Date.now().toString().slice(-8)}
- Total: $${total.toFixed(2)} MXN
- Fecha: ${new Date().toLocaleDateString('es-MX')}

Para descargar su factura completa, visite: ${window.location.origin}/factura.html

Atentamente,
Equipo de Borrachorama
facturacion@borrachorama.com`);

            window.open(`mailto:${datos.email}?subject=${asunto}&body=${cuerpo}`);
        }

        function enviarPorWhatsApp() {
            const datos = JSON.parse(localStorage.getItem('datosFactura') || '{}');
            const pedido = JSON.parse(localStorage.getItem('pedidos') || '[]').find(p => p.id === localStorage.getItem('lastPedidoId'));
            const total = pedido ? pedido.total : 0;
            
            const mensaje = encodeURIComponent(`¡Hola! Aquí tienes tu factura electrónica de Borrachorama 🍺

📄 Folio: FCT-${Date.now().toString().slice(-8)}
💰 Total: $${total.toFixed(2)} MXN
📅 Fecha: ${new Date().toLocaleDateString('es-MX')}

Para ver y descargar tu factura completa, visita: ${window.location.origin}/factura.html

¡Gracias por tu compra! 🎉`);

            window.open(`https://wa.me/?text=${mensaje}`);
        }
    </script>
</body>
</html>
