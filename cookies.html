<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administrar Cookies - Borrachorama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #fffafb; color: #333; padding: 30px; }
    .card { max-width: 760px; margin: 30px auto; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    h1 { color: #d57c00; }
    .notification { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 12px 18px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); z-index: 9999; }
    .notification.error { background: linear-gradient(135deg,#f44336 0%,#da190b 100%); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍪 Administrar Cookies</h1>
    <p style="color:#666;">Aquí puedes ver y cambiar tus preferencias de cookies en cualquier momento.</p>

    <div style="margin-top:18px;">
      <label style="display:flex; align-items:center; margin-bottom:12px;">
        <input type="checkbox" id="cfg_configuracion" style="width:18px; height:18px; margin-right:10px;">
        <strong style="color:#FF6F00;">⚙️ Configuración</strong>
      </label>
      <p style="margin-left:28px; color:#666;">Guardar preferencias de idioma, tema y configuraciones del sitio.</p>

      <label style="display:flex; align-items:center; margin-bottom:12px; margin-top:12px;">
        <input type="checkbox" id="cfg_seguridad" style="width:18px; height:18px; margin-right:10px;">
        <strong style="color:#FF6F00;">🔒 Seguridad</strong>
      </label>
      <p style="margin-left:28px; color:#666;">Proteger tu sesión y prevenir actividades fraudulentas.</p>

      <label style="display:flex; align-items:center; margin-bottom:12px; margin-top:12px;">
        <input type="checkbox" id="cfg_inicio" style="width:18px; height:18px; margin-right:10px;">
        <strong style="color:#FF6F00;">📊 Inicio (Analytics)</strong>
      </label>
      <p style="margin-left:28px; color:#666;">Analizar uso del sitio para mejorar la experiencia.</p>

      

      <div style="margin-top:18px; color:#888; font-size:0.9rem;">Última vez guardado: <span id="lastSaved">-</span></div>
    </div>
  </div>

  <script>
    function mostrarNotificacion(msg, tipo = 'success'){
      const n = document.createElement('div');
      n.className = 'notification' + (tipo==='error'? ' error':'');
      n.textContent = msg;
      document.body.appendChild(n);
      setTimeout(()=> n.remove(), 3000);
    }

    function cargarPreferencias(){
      const p = JSON.parse(localStorage.getItem('cookiePreferences') || '{}');
      document.getElementById('cfg_configuracion').checked = !!p.configuracion;
      document.getElementById('cfg_seguridad').checked = !!p.seguridad;
      document.getElementById('cfg_inicio').checked = !!p.inicio;
      document.getElementById('lastSaved').textContent = p.fecha ? new Date(p.fecha).toLocaleString() : '-';
    }

    function guardarPreferencias(pref){
      pref.fecha = new Date().toISOString();
      localStorage.setItem('cookiePreferences', JSON.stringify(pref));
      mostrarNotificacion('Preferencias guardadas', 'success');
    }

    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const pref = {
        configuracion: document.getElementById('cfg_configuracion').checked,
        seguridad: document.getElementById('cfg_seguridad').checked,
        inicio: document.getElementById('cfg_inicio').checked
      };
      guardarPreferencias(pref);
      cargarPreferencias();
    });

    document.getElementById('acceptAll').addEventListener('click', ()=>{
      const pref = { configuracion: true, seguridad: true, inicio: true };
      guardarPreferencias(pref);
      cargarPreferencias();
    });

    document.getElementById('rejectAll').addEventListener('click', ()=>{
      const pref = { configuracion: false, seguridad: false, inicio: false };
      guardarPreferencias(pref);
      cargarPreferencias();
    });

    // cargar al inicio
    cargarPreferencias();
  </script>
</body>
</html>
